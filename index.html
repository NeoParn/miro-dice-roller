<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dice Roller (headless)</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
  // Headless entry: runs while the board is open. Opens the panel on toolbar icon click.
  miro.board.ui.on('icon:click', async () => {
    await miro.board.ui.openPanel({ url: 'panel.html?v=' + Date.now(), height: 720 });
  });
</script>
</body>
</html>
